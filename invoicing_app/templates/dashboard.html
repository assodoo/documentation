{% extends "base.html" %}
{% block title %}Tableau de bord — Facturation{% endblock %}

{% block content %}
<h2 class="mb-4">Tableau de bord</h2>

<div class="row g-4 mb-5">
    <div class="col-md-4">
        <div class="card stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="me-3">
                    <i class="bi bi-people stat-icon"></i>
                </div>
                <div>
                    <div class="stat-value">{{ nb_clients }}</div>
                    <div class="stat-label">Clients</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="me-3">
                    <i class="bi bi-file-earmark-text stat-icon"></i>
                </div>
                <div>
                    <div class="stat-value">{{ nb_factures }}</div>
                    <div class="stat-label">Factures</div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card">
            <div class="card-body d-flex align-items-center">
                <div class="me-3">
                    <i class="bi bi-cash-stack stat-icon"></i>
                </div>
                <div>
                    <div class="stat-value" style="font-size:1.5rem">{{ revenue|fcfa }}</div>
                    <div class="stat-label">Chiffre d'affaires</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-navy">
                <i class="bi bi-plus-circle me-1"></i>Actions rapides
            </div>
            <div class="card-body">
                <a href="{{ url_for('nouveau_client') }}" class="btn btn-primary me-2 mb-2">
                    <i class="bi bi-person-plus me-1"></i>Nouveau client
                </a>
                <a href="{{ url_for('nouvelle_facture') }}" class="btn btn-primary mb-2">
                    <i class="bi bi-file-earmark-plus me-1"></i>Nouvelle facture
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
